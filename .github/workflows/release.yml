name: Create New Release with APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release'
        required: false
        default: 'v1.51.39'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compute Release Tag
        id: release_info
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Decode Keystore from GitHub Secrets
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > androidApp/Nightjar.keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build Android Release APK
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Prepare APK Release Files
        run: |
          cp androidApp/build/outputs/apk/release/androidApp-release.apk "androidApp/build/outputs/apk/release/Th3GradeLibrary_${{ steps.release_info.outputs.tag }}.apk"
          cp androidApp/build/outputs/apk/release/androidApp-release.apk "androidApp/build/outputs/apk/release/كتب_وملازم_الثالث_متوسط_${{ steps.release_info.outputs.tag }}.apk"

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Th3GradeLibrary_${{ steps.release_info.outputs.tag }}
          path: |
            androidApp/build/outputs/apk/release/Th3GradeLibrary_${{ steps.release_info.outputs.tag }}.apk
            androidApp/build/outputs/apk/release/كتب_وملازم_الثالث_متوسط_${{ steps.release_info.outputs.tag }}.apk
            androidApp/build/outputs/apk/release/androidApp-release.apk

      - name: Create Release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: كتب وملازم الثالث متوسط 2027 العراق (${{ steps.release_info.outputs.tag }})
          body: |
            # 📚 تطبيق كتب وملازم الثالث متوسط (المنهج العراقي 2026 / 2027)
            ### الإصدار الرسمي المستقر: ${{ steps.release_info.outputs.tag }}

            ---

            ### 🌟 نبذة شاملة عن التطبيق (Overview)
            تطبيق **«مكتبة الثالث متوسط»** هو المنصة التعليمية المتكاملة والشاملة لطلبة مرحلة الثالث المتوسط في العراق. يضم التطبيق جميع الكتب المدرسية الرسمية الصادرة عن وزارة التربية العراقية بأحدث الطبعات المعتمدة، إلى جانب باقة غنية من الملازم الدراسية النموذجية والملخصات الوزارية والأسئلة وحلولها، كل ذلك بواجهة عصرية فائقة النعومة مبنية بأحدث معايير Kotlin Multiplatform و Jetpack Compose العالمية لعام 2026/2027.

            ---

            ### ✨ الميزات والإمكانيات الكاملة للتطبيق (Full Features)

            1. 📖 **الكتب والمناهج الرسمية الكاملة:**
               - جميع كتب الصف الثالث المتوسط الرسمية (القرآن الكريم والتربية الإسلامية، اللغة العربية، اللغة الإنكليزية وكتاب النشاط، الرياضيات، الأحياء، الكيمياء، الفيزياء، الاجتماعيات، الحاسوب).
               - تصفح مباشر بدون الحاجة لاتصال مستمر بالإنترنت بعد أول قراءة.

            2. 📝 **الملازم والملخصات الدراسية المعتمدة:**
               - نخبة من أفضل الملازم الدراسية وأدق التلخيصات لجميع المواد التعليمية.
               - تقسيم ذكي وسريع بين الكتب والملازم مع إمكانية التبديل بين وضع الشبكة (Grid View) ووضع القائمة (List View).

            3. 📑 **نظام المحفوظات الذكي (Bookmarks System):**
               - إمكانية حفظ أي صفحة أثناء القراءة والعودة إليها بنقرة واحدة.
               - منسدلة أنيقة لكل كتاب تجمع صفحاته المحفوظة مع خاصية التوسيع والتقلص الانسيابي.
               - انتقال سائل ومستقر تماماً عند فتح الصفحات المحفوظة مع استقرار هندسي مطلق دون أي قفز جانبي أو ومضات.

            4. 🚀 **اختصارات الشاشة الرئيسية وأيقونة التطبيق (App Shortcuts & Launcher):**
               - إمكانية الوصول الفوري والمباشر بضغطة مطولة على أيقونة التطبيق (الكتب، الملازم، المحفوظات، الأخبار).
               - فتح سريع وقفل سلس بانسيابية نظام التشغيل الحديثة دون أي تعثر أو هبوط للأعلى.

            5. 📲 **ودجت ذكي متكيف (Glance Material 3 AppWidget 2026):**
               - ودجت حديث ومتكيف بثلاثة أحجام (صغير، متوسط، عريض) يتيح التفاعل والوصول الفوري للمواد من الشاشة الرئيسية.

            6. 🎨 **تصميم مائي حديث ودعم Material You:**
               - تصميم زجاجي سائل (Liquid Glassmorphism) بتأثيرات ضبابية راقية.
               - دعم التلوين الديناميكي المقتبس من ألوان خلفية نظام أندرويد (Dynamic Material You Palette).
               - وضع السواد الفائق (Pure Black Mode) لشاشات OLED لتوفير الطاقة وحماية العين، مع وضع أبيض فائق (Pure White Mode) ووضع ليلي/نهاري تلقائي.

            7. 📱 **تكيف ديناميكي مع الشاشات العريضة والمطويات (Adaptive M3 1.3.0):**
               - شريط تنقل جانبي متكيف وأنيق في الوضع الأفقي والأجهزة اللوحية والمطويات (Foldables) وحواسيب Google Chromebook و Samsung DeX بعرض مدروس بدقة (52dp - 64dp).
               - معالجة شاملة لأشرطة وحواف النظام وحفر الكاميرا (WindowInsets.statusBars.union(captionBar).union(displayCutout)).

            8. ⚡ **أداء خارق بدون تعتعة (ART Baseline Profiles & JIT Preservation):**
               - ملف Baseline Profile شامل لكل الشاشات والحركات والودجت يضمن تشغيلاً فورياً من أول إقلاع.
               - حماية كاملة لمجلد الكود المترجم (codeCacheDir) لتفادي أي إعادة تجميع وتوفير استجابة 120Hz فائقة النعومة.
          files: |
            androidApp/build/outputs/apk/release/Th3GradeLibrary_${{ steps.release_info.outputs.tag }}.apk
            androidApp/build/outputs/apk/release/كتب_وملازم_الثالث_متوسط_${{ steps.release_info.outputs.tag }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
