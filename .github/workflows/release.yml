name: Create New Release with APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release'
        required: false
        default: 'v1.51.38'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compute Release Tag
        id: release_info
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Decode Keystore from GitHub Secrets
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > androidApp/Nightjar.keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build Android Release APK
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Prepare APK Release Files
        run: |
          cp androidApp/build/outputs/apk/release/androidApp-release.apk "androidApp/build/outputs/apk/release/Th3GradeLibrary_${{ steps.release_info.outputs.tag }}.apk"
          cp androidApp/build/outputs/apk/release/androidApp-release.apk "androidApp/build/outputs/apk/release/كتب_وملازم_الثالث_متوسط_${{ steps.release_info.outputs.tag }}.apk"

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Th3GradeLibrary_${{ steps.release_info.outputs.tag }}
          path: |
            androidApp/build/outputs/apk/release/Th3GradeLibrary_${{ steps.release_info.outputs.tag }}.apk
            androidApp/build/outputs/apk/release/كتب_وملازم_الثالث_متوسط_${{ steps.release_info.outputs.tag }}.apk
            androidApp/build/outputs/apk/release/androidApp-release.apk

      - name: Create Release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: كتب وملازم الثالث متوسط 2027 العراق (${{ steps.release_info.outputs.tag }})
          body: |
            تطبيق «كتب وملازم الثالث متوسط 2027 العراق» - الإصدار ${{ steps.release_info.outputs.tag }}

            التحديثات والمميزات:
            - حركة فتح وإغلاق رطبة وفائقة السلاسة تحاكي نظام الهواتف الذكية (Android 15/16 و iOS): تراجع الشاشة للعمق عند فتح القارئ وتقدمها للأمام بنعومة عند الإغلاق دون أي ومضة أو انقطاع.
            - تثبيت واستقرار مستطيل الصفحة المحفوظة في الشاشة مع بقاء SharedBounds مسجلاً وحمايته داخل طبقة الـ Overlay تحت أشرطة النظام، ومنع قفز المستطيل للجانب نهائياً عند إغلاق المنسدلة.
            - ارتداد مطاطي رطب (Fluid Elastic Overscroll) عند نهاية التمرير في القوائم والشبكات.
            - تنقل أفقي سلس بين الشاشات الرئيسية بنظام الإزاحة المتوازية (Parallax Slide) بنسبة 32% ومقياس مجهري 0.98 -> 1.0 يمنع الحركة السريعة المجهدة في الشاشات العريضة والمطوية.
            - دعم كامل لأحدث معايير Android Jetpack Compose 2026/2027 ومبادئ Navigation 3 مع الحفاظ على التوافق مع الشاشات اللوحية و DeX و Googlebook.
          files: |
            androidApp/build/outputs/apk/release/Th3GradeLibrary_${{ steps.release_info.outputs.tag }}.apk
            androidApp/build/outputs/apk/release/كتب_وملازم_الثالث_متوسط_${{ steps.release_info.outputs.tag }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
