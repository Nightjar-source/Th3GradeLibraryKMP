name: Create New Release with APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release'
        required: false
        default: 'v1.51.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compute Release Tag
        id: release_info
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Decode Keystore from GitHub Secrets
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > androidApp/Nightjar.keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build Android Release APK
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Prepare APK with Official Arabic Name
        run: |
          cp androidApp/build/outputs/apk/release/androidApp-release.apk "androidApp/build/outputs/apk/release/كتب_وملازم_الثالث_متوسط_${{ steps.release_info.outputs.tag }}.apk"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: كتب وملازم الثالث متوسط 2027 العراق (${{ steps.release_info.outputs.tag }})
          body: |
            تطبيق «كتب وملازم الثالث متوسط 2027 العراق» - الإصدار ${{ steps.release_info.outputs.tag }}

            التحديثات والمميزات:
            - دعم كامل لأحدث معايير Android Jetpack Compose 2026/2027.
            - حركات وانتقالات سلسة فائقة الرطوبة (Fluid Spring Transitions) للشاشات والأغلفة وصفحات المحفوظات بمعدل 120 إطاراً في الثانية.
            - فتح وغلق المنسدلات بانسيابية تامة ودوران الأيقونة 360 درجة بدون أي وميض أو قفزات.
            - شريط تنقل سفلي وجانبي سائل (Liquid Frosted Glass) بتصميم بيضاوي مع زر قائمة جانبي مستقل.
            - انتقال فوري وعائم إلى قارئ الكتب والـ PDF بدون تكرار مؤشرات التحميل.
            - تنظيف ذكي وفوري للذاكرة المؤقتة وحذف الملفات المستخرجة عند إغلاق التطبيق.
          files: |
            androidApp/build/outputs/apk/release/كتب_وملازم_الثالث_متوسط_${{ steps.release_info.outputs.tag }}.apk
            androidApp/build/outputs/apk/release/androidApp-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}