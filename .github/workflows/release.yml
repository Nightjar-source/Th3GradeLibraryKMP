name: Create New Release with APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release'
        required: false
        default: 'v1.2.42'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compute Release Tag
        id: release_info
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Decode Keystore from GitHub Secrets
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > androidApp/Nightjar.keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build Android Release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Prepare APK Release Files
        run: |
          cp androidApp/build/outputs/apk/release/androidApp-release.apk "androidApp/build/outputs/apk/release/Th3GradeLibrary_${{ steps.release_info.outputs.tag }}.apk"
          cp androidApp/build/outputs/apk/release/androidApp-release.apk "androidApp/build/outputs/apk/release/كتب_وملازم_الثالث_متوسط_${{ steps.release_info.outputs.tag }}.apk"

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Th3GradeLibrary_${{ steps.release_info.outputs.tag }}
          path: |
            androidApp/build/outputs/apk/release/Th3GradeLibrary_${{ steps.release_info.outputs.tag }}.apk
            androidApp/build/outputs/apk/release/كتب_وملازم_الثالث_متوسط_${{ steps.release_info.outputs.tag }}.apk
            androidApp/build/outputs/apk/release/androidApp-release.apk

      - name: Create Release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: كتب وملازم الثالث متوسط 2027 العراق
          body: |
            كتب وملازم الثالث متوسط 2027 العراق

            [b]كتب وملازم الثالث متوسط 2027 العراق
            [/b]

            تطبيق «كتب وملازم الثالث متوسط 2027» هو دليلك الدراسي الشامل لتحقيق التفوق والنجاح في العراق. يوفر التطبيق مكتبة رقمية متكاملة تضم جميع المناهج الوزارية والكتب المدرسية الرسمية المحدثة لعام 2027، إلى جانب نخبة من أفضل ملازم الأساتذة المعتمدين والموثوقين.


            يتميز التطبيق بتنظيم احترافي يشمل:
            ملازم نموذجية: شروحات مبسطة وواضحة لجميع المواد (الرياضيات، الإنكليزي، الأحياء، الكيمياء، الفيزياء، واللغة العربية).
            حلول الأسئلة الوزارية: أسئلة التمهيدي والدور الأول والثاني للسنوات السابقة مع الأجوبة النموذجية الدقيقة.
            مرشحات وملخصات مركزة: مراجعات سريعة لليالي الامتحانات تساعدك على ضمان الدرجات العالية.
            إمكانية القراءة دون إنترنت: تحميل مباشر للملفات بصيغة PDF لتصفحها في أي وقت ومكان بسهولة تامة.
          files: |
            androidApp/build/outputs/apk/release/Th3GradeLibrary_${{ steps.release_info.outputs.tag }}.apk
            androidApp/build/outputs/apk/release/كتب_وملازم_الثالث_متوسط_${{ steps.release_info.outputs.tag }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
